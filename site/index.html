<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5">
<title>Amazon FC · Fulfillment Journey</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* ════════════════════════════════════════════════════
   RESET & ROOT
════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --orange:#FF9900; --dark:#131921; --navy:#232F3E;
  --navy2:#1a2535; --bg:#0d1117; --surface:#161d27;
  --border:rgba(255,153,0,0.18); --text:#f0f0f0; --muted:#8899aa;
  --card-w:200px; --card-h:260px;
  --gap:56px; --floor-y:340px;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;}

/* ════════════════════════════════════════════════════
   HEADER
════════════════════════════════════════════════════ */
#header{
  position:fixed;top:0;left:0;right:0;height:58px;
  background:rgba(13,17,23,0.92);backdrop-filter:blur(16px);
  border-bottom:2px solid var(--orange);
  display:flex;align-items:center;gap:16px;padding:0 28px;
  z-index:100;
}
.h-logo{width:38px;height:38px;background:var(--orange);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.h-wordmark{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;color:#fff;letter-spacing:0.5px;}
.h-wordmark span{color:var(--orange);}
.h-subtitle{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;border-left:1px solid rgba(255,255,255,0.12);padding-left:16px;margin-left:4px;}
.h-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.h-badge{background:var(--orange);color:var(--dark);font-size:10px;font-weight:800;padding:3px 10px;border-radius:12px;letter-spacing:1px;text-transform:uppercase;}
.h-btn{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:var(--muted);padding:6px 14px;border-radius:20px;cursor:pointer;font-size:11px;font-weight:700;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase;transition:all 0.15s;}
.h-btn:hover,.h-btn.active{background:rgba(255,153,0,0.2);color:var(--orange);border-color:rgba(255,153,0,0.4);}
@media(max-width:600px){.h-subtitle{display:none;}.h-wordmark{font-size:16px;}}

/* ════════════════════════════════════════════════════
   WORLD CONTAINER — horizontal scroll scene
════════════════════════════════════════════════════ */
#world-wrap{
  position:fixed;inset:58px 0 0 0;
  overflow:hidden;
}
/* Three.js canvas behind everything */
#bg-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;}

/* The scrollable world */
#world{
  position:absolute;inset:0;
  overflow-x:auto;overflow-y:hidden;
  scrollbar-width:thin;scrollbar-color:var(--orange) rgba(255,255,255,0.05);
  cursor:grab;
  -webkit-overflow-scrolling:touch;
}
#world::-webkit-scrollbar{height:4px;}
#world::-webkit-scrollbar-track{background:rgba(255,255,255,0.04);}
#world::-webkit-scrollbar-thumb{background:var(--orange);border-radius:2px;}
#world.grabbing{cursor:grabbing;}

/* The inner scene — wide enough for all cards */
#scene{
  position:relative;
  height:100%;
  display:flex;
  align-items:flex-end;
  padding:0 60px 110px;
  gap:0;
  min-height:100%;
  width:max-content;
}

/* ════════════════════════════════════════════════════
   WAREHOUSE FLOOR
════════════════════════════════════════════════════ */
#floor{
  position:absolute;bottom:0;left:0;right:0;height:130px;
  background:linear-gradient(180deg,transparent 0%,rgba(255,153,0,0.03) 40%,rgba(255,153,0,0.07) 100%);
  border-top:2px solid rgba(255,153,0,0.15);
  z-index:1;pointer-events:none;
}
/* Floor dashes - animated */
#floor::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:repeating-linear-gradient(90deg,var(--orange) 0,var(--orange) 30px,transparent 30px,transparent 50px);
  animation:floorMove 3s linear infinite;opacity:0.35;
}
@keyframes floorMove{to{background-position:80px 0;}}
/* Shadow under cards */
.card-shadow{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:80%;height:20px;
  background:radial-gradient(ellipse,rgba(0,0,0,0.5) 0%,transparent 70%);
  pointer-events:none;z-index:1;
}

/* ════════════════════════════════════════════════════
   FLOW PATH — SVG arrows between cards
════════════════════════════════════════════════════ */
#flow-arrows{
  position:absolute;top:0;left:0;right:0;bottom:0;
  pointer-events:none;z-index:2;overflow:visible;
}

/* ════════════════════════════════════════════════════
   STEP CARDS — the Pixar-style nodes
════════════════════════════════════════════════════ */
.step-block{
  position:relative;
  display:flex;flex-direction:column;align-items:center;
  flex-shrink:0;
  z-index:10;
  padding:0 calc(var(--gap)/2);
}

/* The card itself */
.step-card{
  width:var(--card-w);
  background:linear-gradient(160deg,rgba(30,40,55,0.95) 0%,rgba(18,26,38,0.98) 100%);
  border:1.5px solid rgba(255,255,255,0.07);
  border-radius:18px;
  overflow:hidden;
  cursor:pointer;
  position:relative;
  transition:transform 0.3s cubic-bezier(0.34,1.4,0.64,1), box-shadow 0.3s, border-color 0.3s;
  box-shadow:0 8px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
}
.step-card:hover{
  transform:translateY(-10px) scale(1.03);
  border-color:rgba(255,153,0,0.5);
  box-shadow:0 20px 50px rgba(0,0,0,0.6),0 0 30px rgba(255,153,0,0.12);
}
.step-card.active{
  transform:translateY(-14px) scale(1.06);
  border-color:var(--orange);
  box-shadow:0 24px 60px rgba(0,0,0,0.7),0 0 40px rgba(255,153,0,0.3);
}
.step-card.done{opacity:0.55;filter:saturate(0.5);}
.step-card.done:hover{opacity:0.85;filter:saturate(0.8);}

/* Top accent stripe — role color */
.card-stripe{height:4px;width:100%;}

/* Character image — fills most of the card */
.card-scene{
  position:relative;
  height:160px;
  overflow:hidden;
  display:flex;align-items:flex-end;justify-content:center;
}
.card-env{
  position:absolute;inset:0;
  object-fit:cover;width:100%;height:100%;
  opacity:0.18;
}
.card-char{
  position:relative;z-index:2;
  max-height:145px;max-width:90%;
  object-fit:contain;
  filter:drop-shadow(0 6px 18px rgba(0,0,0,0.8));
  transition:transform 0.4s cubic-bezier(0.34,1.5,0.64,1);
  transform-origin:bottom center;
}
.step-card:hover .card-char,.step-card.active .card-char{transform:scale(1.08) translateY(-4px);}

/* Idle bob on character */
@keyframes cardCharIdle{
  0%,100%{transform:translateY(0) rotate(-0.5deg);}
  50%{transform:translateY(-5px) rotate(0.5deg);}
}
.card-char{animation:cardCharIdle 3s ease-in-out infinite;}
.step-card:hover .card-char,.step-card.active .card-char{animation:none;}

/* Card info footer */
.card-info{
  padding:10px 12px 12px;
  background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,0.4) 100%);
}
.card-step-num{
  font-size:9px;font-weight:800;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--orange);margin-bottom:2px;
}
.card-title{
  font-family:'Barlow Condensed',sans-serif;
  font-size:15px;font-weight:800;color:#fff;line-height:1.15;
  margin-bottom:3px;
}
.card-role{font-size:10px;color:var(--muted);font-weight:500;line-height:1.3;}

/* Glow ring on active */
.step-card.active::before{
  content:'';position:absolute;inset:-2px;border-radius:19px;
  background:linear-gradient(135deg,var(--orange),transparent,var(--orange));
  z-index:-1;animation:ringPulse 2s ease-in-out infinite;
}
@keyframes ringPulse{
  0%,100%{opacity:0.4;}50%{opacity:1;}
}

/* Done checkmark */
.card-done-tick{
  position:absolute;top:8px;right:8px;z-index:10;
  width:22px;height:22px;border-radius:50%;
  background:#2ECC71;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:white;
  box-shadow:0 2px 8px rgba(46,204,113,0.5);
  opacity:0;transform:scale(0);transition:opacity 0.3s,transform 0.3s;
}
.step-card.done .card-done-tick{opacity:1;transform:scale(1);}

/* Card equip badge */
.card-equip{
  position:absolute;bottom:60px;right:6px;z-index:3;
  width:44px;height:44px;
  object-fit:contain;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,0.7));
  opacity:0.8;
}

/* Step number label below card */
.step-connector-label{
  margin-top:10px;
  font-family:'Barlow Condensed',sans-serif;
  font-size:10px;font-weight:700;letter-spacing:1px;
  color:var(--muted);text-transform:uppercase;
  text-align:center;
}

/* ════════════════════════════════════════════════════
   START / END EVENTS
════════════════════════════════════════════════════ */
.event-block{
  position:relative;display:flex;flex-direction:column;align-items:center;
  flex-shrink:0;z-index:10;padding:0 28px;
  align-self:flex-end;margin-bottom:30px;
}
.event-circle{
  width:64px;height:64px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:24px;
  position:relative;
}
.ev-start{background:radial-gradient(circle,#0aaa6e,#067D62);border:3px solid #04D4A0;box-shadow:0 0 20px rgba(4,212,160,0.4);}
.ev-end  {background:radial-gradient(circle,#e05050,#C0392B);border:3px solid #E74C3C;box-shadow:0 0 20px rgba(231,76,60,0.4);}
@keyframes evPulse{0%,100%{box-shadow:0 0 20px rgba(4,212,160,0.4);}50%{box-shadow:0 0 36px rgba(4,212,160,0.7);}}
@keyframes evPulseR{0%,100%{box-shadow:0 0 20px rgba(231,76,60,0.4);}50%{box-shadow:0 0 36px rgba(231,76,60,0.7);}}
.ev-start{animation:evPulse 2.5s infinite;}
.ev-end{animation:evPulseR 2.5s infinite;}
.event-label{margin-top:8px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);white-space:nowrap;}

/* ════════════════════════════════════════════════════
   GATEWAY DIAMONDS
════════════════════════════════════════════════════ */
.gateway-block{
  position:relative;display:flex;flex-direction:column;align-items:center;
  flex-shrink:0;z-index:10;padding:0 20px;
  align-self:flex-end;margin-bottom:24px;
}
.gateway-diamond{
  width:68px;height:68px;
  background:linear-gradient(135deg,#FF9900,#E67E00);
  transform:rotate(45deg);border-radius:8px;
  border:2px solid rgba(255,255,255,0.2);
  box-shadow:0 6px 24px rgba(255,153,0,0.4);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;
  position:relative;
}
.gateway-diamond:hover{transform:rotate(45deg) scale(1.12);box-shadow:0 10px 32px rgba(255,153,0,0.6);}
.gateway-icon{transform:rotate(-45deg);font-size:22px;}
.gateway-char{
  position:absolute;bottom:calc(100% + 4px);left:50%;
  transform:translateX(-50%) rotate(-45deg);
  width:38px;height:38px;object-fit:contain;
  filter:drop-shadow(0 3px 8px rgba(0,0,0,0.7));
}
.gateway-label{
  margin-top:44px;
  font-family:'Barlow Condensed',sans-serif;
  font-size:11px;font-weight:800;letter-spacing:0.8px;
  text-transform:uppercase;color:#FF9900;white-space:nowrap;text-align:center;
}
.gateway-paths{
  display:flex;gap:8px;margin-top:6px;
}
.gw-path{
  font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;
}
.gw-yes{background:rgba(46,204,113,0.15);color:#2ECC71;border:1px solid rgba(46,204,113,0.3);}
.gw-no {background:rgba(231,76,60,0.15);color:#E74C3C;border:1px solid rgba(231,76,60,0.3);}

/* ════════════════════════════════════════════════════
   EXCEPTION BRANCH — below the flow
════════════════════════════════════════════════════ */
#exception-zone{
  position:absolute;
  display:flex;flex-direction:column;align-items:center;
  z-index:10;
}
.exception-card{
  width:180px;
  background:linear-gradient(160deg,rgba(74,26,26,0.9),rgba(40,10,10,0.95));
  border:1.5px solid rgba(231,76,60,0.3);
  border-radius:16px;overflow:hidden;cursor:pointer;
  transition:transform 0.3s,box-shadow 0.3s;
  box-shadow:0 8px 28px rgba(0,0,0,0.5);
}
.exception-card:hover{transform:translateY(-6px) scale(1.03);border-color:rgba(231,76,60,0.7);}

/* ════════════════════════════════════════════════════
   FLOW CONNECTOR ARROWS (SVG inline)
════════════════════════════════════════════════════ */
.flow-svg-arrow{
  stroke:#FF9900;stroke-width:2.5;fill:none;
  stroke-dasharray:8 5;
  animation:arrowFlow 1.2s linear infinite;
  opacity:0.4;
}
.flow-svg-arrow.lit{opacity:1;stroke-width:3;animation:arrowFlow 0.6s linear infinite;}
@keyframes arrowFlow{to{stroke-dashoffset:-26;}}

/* ════════════════════════════════════════════════════
   PLAYBACK BAR
════════════════════════════════════════════════════ */
#playbar{
  position:fixed;bottom:0;left:0;right:0;height:62px;
  background:rgba(13,17,23,0.94);backdrop-filter:blur(16px);
  border-top:1px solid rgba(255,153,0,0.2);
  display:flex;align-items:center;justify-content:center;gap:10px;
  z-index:100;padding:0 20px;
}
.pb-btn{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#bbb;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all 0.15s;}
.pb-btn:hover{background:rgba(255,153,0,0.2);color:var(--orange);border-color:rgba(255,153,0,0.4);}
.pb-play{width:46px;height:46px;background:var(--orange);color:var(--dark);font-size:16px;border:none;font-weight:700;}
.pb-play:hover{background:#FFB733;color:var(--dark);}
#pb-progress{
  flex:1;max-width:400px;
  display:flex;flex-direction:column;gap:4px;
}
#pb-track{height:3px;background:rgba(255,255,255,0.1);border-radius:3px;overflow:hidden;}
#pb-fill{height:100%;background:linear-gradient(90deg,var(--orange),#FFD166);width:0%;transition:width 0.5s ease;border-radius:3px;}
#pb-label{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:0.5px;text-align:center;}
#pb-speed{background:transparent;border:1px solid rgba(255,153,0,0.3);color:var(--orange);font-size:10px;font-weight:800;padding:3px 9px;border-radius:10px;cursor:pointer;letter-spacing:0.5px;font-family:'Barlow Condensed',sans-serif;}
#pb-speed:hover{background:rgba(255,153,0,0.15);}
#story-btn{background:linear-gradient(135deg,var(--orange),#E67E00);color:var(--dark);border:none;border-radius:22px;padding:9px 20px;font-size:12px;font-weight:800;cursor:pointer;font-family:'Barlow Condensed',sans-serif;letter-spacing:1.2px;text-transform:uppercase;box-shadow:0 4px 16px rgba(255,153,0,0.4);transition:all 0.15s;white-space:nowrap;}
#story-btn:hover{transform:scale(1.05);box-shadow:0 6px 24px rgba(255,153,0,0.6);}
@media(max-width:600px){
  #pb-progress{max-width:160px;}
  .pb-btn{width:30px;height:30px;font-size:13px;}
  .pb-play{width:38px;height:38px;}
  #story-btn{padding:7px 12px;font-size:11px;}
}

/* ════════════════════════════════════════════════════
   DETAIL PANEL (slide up from bottom)
════════════════════════════════════════════════════ */
#detail-panel{
  position:fixed;bottom:-100%;left:0;right:0;
  height:min(520px,72vh);
  background:linear-gradient(180deg,rgba(19,25,33,0.98) 0%,rgba(13,17,23,1) 100%);
  border-top:2px solid var(--orange);
  border-radius:22px 22px 0 0;
  z-index:200;
  transition:bottom 0.4s cubic-bezier(0.4,0,0.2,1);
  display:grid;grid-template-columns:280px 1fr;
  overflow:hidden;
  box-shadow:0 -20px 60px rgba(0,0,0,0.7);
}
#detail-panel.open{bottom:0;}
/* Drag handle */
#detail-panel::before{
  content:'';position:absolute;top:10px;left:50%;transform:translateX(-50%);
  width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,0.15);
}
/* Left — big character */
#dp-scene{
  position:relative;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,153,0,0.04) 0%,rgba(0,0,0,0.4) 100%);
  border-right:1px solid rgba(255,255,255,0.06);
}
#dp-env{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.2;}
#dp-char{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  max-height:88%;max-width:90%;object-fit:contain;
  filter:drop-shadow(0 8px 24px rgba(0,0,0,0.9));
  transition:transform 0.5s cubic-bezier(0.34,1.5,0.64,1);
}
#dp-char.entered{transform:translateX(-50%) translateY(0);}
#dp-equip{
  position:absolute;bottom:10px;right:10px;
  max-height:80px;max-width:45%;object-fit:contain;
  filter:drop-shadow(0 3px 10px rgba(0,0,0,0.7));
  opacity:0.85;
}
#dp-scene::before{
  content:'';position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);
  width:160px;height:160px;
  background:radial-gradient(circle,rgba(255,153,0,0.15) 0%,transparent 70%);
  z-index:1;pointer-events:none;
}
/* Right — info */
#dp-info{padding:28px 28px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;}
#dp-info::-webkit-scrollbar{width:4px;}
#dp-info::-webkit-scrollbar-thumb{background:rgba(255,153,0,0.3);border-radius:2px;}
.dp-badge{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.dp-step-tag{background:var(--orange);color:var(--dark);font-size:9px;font-weight:800;padding:3px 10px;border-radius:12px;letter-spacing:1.2px;text-transform:uppercase;}
.dp-role-tag{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:0.8px;text-transform:uppercase;}
#dp-title{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:900;color:#fff;line-height:1.05;}
#dp-desc{font-size:13px;line-height:1.7;color:rgba(255,255,255,0.78);}
.dp-section-lbl{font-size:9px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--orange);margin-bottom:6px;}
.dp-chips{display:flex;flex-wrap:wrap;gap:5px;}
.dp-chip-t{background:rgba(55,169,245,0.1);border:1px solid rgba(55,169,245,0.25);color:#37A9F5;font-size:11px;font-weight:600;padding:3px 9px;border-radius:12px;}
.dp-chip-c{background:rgba(255,153,0,0.08);border:1px solid rgba(255,153,0,0.22);color:#FFB733;font-size:11px;font-weight:600;padding:3px 9px;border-radius:12px;}
.raci-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.raci-cell{border-radius:8px;padding:9px 11px;}
.raci-R{background:rgba(255,100,0,0.1);border:1px solid rgba(255,100,0,0.25);}
.raci-A{background:rgba(46,204,113,0.08);border:1px solid rgba(46,204,113,0.22);}
.raci-C{background:rgba(52,152,219,0.08);border:1px solid rgba(52,152,219,0.22);}
.raci-I{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);}
.raci-letter{font-size:10px;font-weight:900;letter-spacing:1px;text-transform:uppercase;margin-bottom:1px;}
.raci-R .raci-letter{color:#FF6400;}.raci-A .raci-letter{color:#2ECC71;}.raci-C .raci-letter{color:#3498DB;}.raci-I .raci-letter{color:var(--muted);}
.raci-lbl{font-size:9px;color:var(--muted);font-weight:500;margin-bottom:3px;}
.raci-val{font-size:11px;font-weight:700;color:#ddd;}
#dp-close{
  position:absolute;top:16px;right:16px;
  background:rgba(255,255,255,0.08);border:none;color:var(--muted);
  width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px;
  display:flex;align-items:center;justify-content:center;transition:all 0.15s;
}
#dp-close:hover{background:rgba(255,153,0,0.2);color:var(--orange);}
/* Mobile: stack vertically */
@media(max-width:700px){
  #detail-panel{grid-template-columns:1fr;grid-template-rows:200px 1fr;height:min(580px,82vh);}
  #dp-scene{border-right:none;border-bottom:1px solid rgba(255,255,255,0.06);}
  #dp-info{padding:16px 18px;}
}

/* ════════════════════════════════════════════════════
   CINEMATIC OVERLAY (Three.js story mode)
════════════════════════════════════════════════════ */
#cinema-overlay{
  position:fixed;inset:0;z-index:300;
  pointer-events:none;opacity:0;
  transition:opacity 0.45s;
  display:flex;align-items:center;justify-content:center;
}
#cinema-overlay.visible{opacity:1;pointer-events:all;}
#cinema-bg-canvas{position:absolute;inset:0;width:100%;height:100%;}
#cinema-overlay::before{content:'';position:absolute;inset:0;background:rgba(8,12,18,0.82);backdrop-filter:blur(6px);}
#cinema-card{
  position:relative;z-index:10;
  width:min(780px,94vw);max-height:88vh;
  background:linear-gradient(160deg,#1a2535 0%,#0f1820 100%);
  border:1px solid rgba(255,153,0,0.4);border-radius:24px;
  overflow:hidden;
  box-shadow:0 40px 100px rgba(0,0,0,0.8),inset 0 1px 0 rgba(255,255,255,0.06);
  display:grid;grid-template-rows:auto 1fr auto;
}
.cin-hdr{background:rgba(0,0,0,0.4);padding:14px 20px;border-bottom:1.5px solid rgba(255,153,0,0.2);display:flex;align-items:center;gap:10px;}
.cin-badge{background:var(--orange);color:var(--dark);font-size:9px;font-weight:800;padding:3px 10px;border-radius:12px;letter-spacing:1.2px;text-transform:uppercase;}
.cin-title{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;color:#fff;flex:1;}
.cin-role{font-size:10px;font-weight:600;color:rgba(255,153,0,0.7);letter-spacing:0.5px;text-transform:uppercase;}
.cin-close{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);color:#aaa;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all 0.15s;flex-shrink:0;}
.cin-close:hover{background:rgba(255,153,0,0.25);color:#fff;}
.cin-body{display:grid;grid-template-columns:300px 1fr;min-height:260px;}
.cin-scene{position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(255,153,0,0.03),rgba(0,0,0,0.3));border-right:1px solid rgba(255,153,0,0.1);}
#cin-env{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.2;}
#cin-char{position:absolute;bottom:0;left:50%;transform:translateX(-50%) translateY(30px) scale(0.85);max-height:88%;max-width:90%;object-fit:contain;filter:drop-shadow(0 10px 28px rgba(0,0,0,0.9));opacity:0;transition:transform 0.6s cubic-bezier(0.34,1.4,0.64,1),opacity 0.5s;z-index:3;}
#cin-char.entered{transform:translateX(-50%) translateY(0) scale(1);opacity:1;}
#cin-equip{position:absolute;bottom:8px;right:8px;max-height:90px;max-width:48%;object-fit:contain;z-index:4;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.7));transform:scale(0.65) translateY(12px);opacity:0;transition:transform 0.5s 0.22s cubic-bezier(0.34,1.4,0.64,1),opacity 0.4s 0.22s;}
#cin-equip.entered{transform:scale(1) translateY(0);opacity:1;}
.cin-scene::before{content:'';position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);width:180px;height:180px;background:radial-gradient(circle,rgba(255,153,0,0.15) 0%,transparent 70%);z-index:2;pointer-events:none;}
.cin-info{padding:22px 24px;display:flex;flex-direction:column;gap:12px;justify-content:center;}
.cin-action{font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--orange);opacity:0;transform:translateY(8px);transition:opacity 0.4s 0.1s,transform 0.4s 0.1s;}
.cin-action.entered{opacity:1;transform:translateY(0);}
.cin-desc{font-size:13.5px;line-height:1.7;color:rgba(255,255,255,0.82);opacity:0;transform:translateY(8px);transition:opacity 0.4s 0.18s,transform 0.4s 0.18s;}
.cin-desc.entered{opacity:1;transform:translateY(0);}
.cin-tools{display:flex;flex-wrap:wrap;gap:5px;opacity:0;transform:translateY(8px);transition:opacity 0.4s 0.26s,transform 0.4s 0.26s;}
.cin-tools.entered{opacity:1;transform:translateY(0);}
.cin-chip{background:rgba(255,153,0,0.1);border:1px solid rgba(255,153,0,0.28);color:#FFB733;font-size:11px;font-weight:600;padding:3px 9px;border-radius:12px;}
.cin-ftr{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-top:1px solid rgba(255,255,255,0.06);background:rgba(0,0,0,0.2);}
.cin-nav{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);color:#bbb;padding:7px 18px;border-radius:20px;cursor:pointer;font-size:12px;font-weight:700;font-family:'Barlow Condensed',sans-serif;letter-spacing:0.8px;text-transform:uppercase;transition:all 0.15s;}
.cin-nav:hover{background:rgba(255,153,0,0.18);color:var(--orange);border-color:rgba(255,153,0,0.4);}
.cin-nav.primary{background:var(--orange);color:var(--dark);border-color:var(--orange);}
.cin-nav.primary:hover{background:#FFB733;}
.cin-dots{display:flex;gap:5px;align-items:center;}
.c-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.15);transition:all 0.3s;}
.c-dot.done{background:rgba(255,153,0,0.4);}.c-dot.active{background:var(--orange);width:18px;border-radius:3px;}
@media(max-width:700px){
  .cin-body{grid-template-columns:1fr;}.cin-scene{height:200px;border-right:none;border-bottom:1px solid rgba(255,153,0,0.1);}
  .cin-info{padding:16px 18px;}
}

/* ════════════════════════════════════════════════════
   SCROLL HINT
════════════════════════════════════════════════════ */
#scroll-hint{
  position:fixed;right:20px;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;align-items:center;gap:6px;
  z-index:50;pointer-events:none;opacity:0.7;
  animation:hintFade 4s 2s forwards;
}
@keyframes hintFade{0%{opacity:0.7;}80%{opacity:0.7;}100%{opacity:0;}}
.scroll-arrow{width:32px;height:32px;border:2px solid rgba(255,153,0,0.4);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:rgba(255,153,0,0.7);animation:arrowBounce 1s infinite;}
@keyframes arrowBounce{0%,100%{transform:translateX(0);}50%{transform:translateX(5px);}}
.scroll-hint-txt{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(255,153,0,0.6);writing-mode:vertical-rl;}

/* ════════════════════════════════════════════════════
   ROLE COLOR STRIPES
════════════════════════════════════════════════════ */
.stripe-driver  {background:linear-gradient(90deg,#37A9F5,#1a5c9a);}
.stripe-receiving{background:linear-gradient(90deg,#2ECC71,#1a6a3a);}
.stripe-water   {background:linear-gradient(90deg,#E67E22,#8a4a10);}
.stripe-stower  {background:linear-gradient(90deg,#9B59B6,#5a1a8a);}
.stripe-picker  {background:linear-gradient(90deg,#17A2B8,#0a5a6a);}
.stripe-packer  {background:linear-gradient(90deg,#8BC34A,#3a6a10);}
.stripe-slam    {background:linear-gradient(90deg,#F1C40F,#8a6a00);}
.stripe-problem {background:linear-gradient(90deg,#E74C3C,#8a1a1a);}
.stripe-start   {background:linear-gradient(90deg,#04D4A0,#067D62);}
.stripe-end     {background:linear-gradient(90deg,#E74C3C,#C0392B);}

/* ════════════════════════════════════════════════════
   STEP TOKEN (travelling package)
════════════════════════════════════════════════════ */
#pkg-token{
  position:fixed;z-index:60;
  width:28px;height:28px;border-radius:50%;
  background:var(--orange);border:3px solid #fff;
  box-shadow:0 2px 14px rgba(255,153,0,0.7);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;pointer-events:none;
  transition:left 0.55s cubic-bezier(0.4,0,0.2,1),top 0.55s cubic-bezier(0.4,0,0.2,1);
  transform:translate(-50%,-50%);
  opacity:0;
}
#pkg-token.visible{opacity:1;}
@keyframes tokenBounce{0%,100%{transform:translate(-50%,-50%) scale(1);}50%{transform:translate(-50%,-50%) scale(1.4);}}
#pkg-token.bounce{animation:tokenBounce 0.35s ease;}
</style>

<body>

<!-- HEADER -->
<header id="header">
  <div class="h-logo">📦</div>
  <div class="h-wordmark">amazon <span>FC</span></div>
  <div class="h-subtitle">Fulfillment Center · End-to-End Workflow</div>
  <div class="h-right">
    <span class="h-badge">Interactive</span>
    <button class="h-btn active" id="view-flow-btn">Flow View</button>
    <button class="h-btn" id="view-story-btn">Story Mode</button>
  </div>
</header>

<!-- WORLD -->
<div id="world-wrap">
  <canvas id="bg-canvas"></canvas>
  <div id="world">
    <div id="scene">
      <!-- Nodes injected by JS -->
    </div>
  </div>
  <div id="floor"></div>
  <div id="scroll-hint">
    <div class="scroll-arrow">→</div>
    <span class="scroll-hint-txt">Scroll</span>
  </div>
</div>

<!-- PACKAGE TOKEN -->
<div id="pkg-token">📦</div>

<!-- PLAYBACK BAR -->
<div id="playbar">
  <button class="pb-btn" id="pb-restart" title="Restart">⟳</button>
  <button class="pb-btn" id="pb-prev">⏮</button>
  <button class="pb-btn pb-play" id="pb-play">▶</button>
  <button class="pb-btn" id="pb-next">⏭</button>
  <div id="pb-progress">
    <div id="pb-label">Press ▶ to walk the warehouse</div>
    <div id="pb-track"><div id="pb-fill"></div></div>
  </div>
  <button id="pb-speed">1×</button>
  <button id="story-btn">✦ Story Mode</button>
</div>

<!-- DETAIL PANEL -->
<div id="detail-panel">
  <button id="dp-close">✕</button>
  <div id="dp-scene">
    <img id="dp-env" src="" alt="">
    <img id="dp-char" src="" alt="">
    <img id="dp-equip" src="" alt="">
  </div>
  <div id="dp-info">
    <div class="dp-badge">
      <span class="dp-step-tag" id="dp-tag">Step</span>
      <span class="dp-role-tag" id="dp-role">Role</span>
    </div>
    <div id="dp-title">Title</div>
    <div id="dp-desc">Desc</div>
    <div>
      <div class="dp-section-lbl">Tools Used</div>
      <div class="dp-chips" id="dp-tools"></div>
    </div>
    <div>
      <div class="dp-section-lbl">Collaborates With</div>
      <div class="dp-chips" id="dp-collab"></div>
    </div>
    <div id="dp-raci-wrap">
      <div class="dp-section-lbl">RACI</div>
      <div class="raci-grid" id="dp-raci"></div>
    </div>
  </div>
</div>

<!-- CINEMA OVERLAY -->
<div id="cinema-overlay">
  <canvas id="cinema-bg-canvas"></canvas>
  <div id="cinema-card">
    <div class="cin-hdr">
      <span class="cin-badge" id="cin-badge">Step</span>
      <span class="cin-title" id="cin-title">Title</span>
      <span class="cin-role" id="cin-role">Role</span>
      <button class="cin-close" id="cin-close">✕</button>
    </div>
    <div class="cin-body">
      <div class="cin-scene">
        <img id="cin-env" src="" alt="">
        <img id="cin-char" src="" alt="">
        <img id="cin-equip" src="" alt="">
      </div>
      <div class="cin-info">
        <div class="cin-action" id="cin-action"></div>
        <div class="cin-desc" id="cin-desc"></div>
        <div class="cin-tools" id="cin-tools"></div>
      </div>
    </div>
    <div class="cin-ftr">
      <button class="cin-nav" id="cin-prev">← Prev</button>
      <div class="cin-dots" id="cin-dots"></div>
      <button class="cin-nav primary" id="cin-next">Next →</button>
    </div>
  </div>
</div>

const scene = document.getElementById('scene');

// Arrow connector helper (inline SVG between blocks)
function makeArrow(color='#FF9900', dashed=false){
  const wrap = document.createElement('div');
  wrap.style.cssText='display:flex;align-items:center;align-self:flex-end;margin-bottom:38px;flex-shrink:0;';
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width','48');svg.setAttribute('height','24');svg.style.overflow='visible';
  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
  const marker = document.createElementNS('http://www.w3.org/2000/svg','marker');
  const mid = 'ah'+Math.random().toString(36).slice(2,6);
  marker.setAttribute('id',mid);marker.setAttribute('markerWidth','8');marker.setAttribute('markerHeight','6');
  marker.setAttribute('refX','7');marker.setAttribute('refY','3');marker.setAttribute('orient','auto');
  const poly = document.createElementNS('http://www.w3.org/2000/svg','polygon');
  poly.setAttribute('points','0 0,8 3,0 6');poly.setAttribute('fill',color);
  marker.appendChild(poly);defs.appendChild(marker);svg.appendChild(defs);
  const line = document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('x1','0');line.setAttribute('y1','12');line.setAttribute('x2','40');line.setAttribute('y2','12');
  line.setAttribute('stroke',color);line.setAttribute('stroke-width','2.5');
  line.setAttribute('marker-end','url(#'+mid+')');
  if(dashed)line.setAttribute('stroke-dasharray','6 4');
  line.classList.add('flow-svg-arrow');
  svg.appendChild(line);wrap.appendChild(svg);
  return {el:wrap, line};
}

// Store DOM refs for animation
const nodeEls = {}; // id → .step-card or event/gateway el
const arrowEls = []; // array of SVG line elements

function buildScene(){
  FLOW.forEach((node, i) => {
    // Arrow before this node (skip first)
    if(i > 0){
      const {el, line} = makeArrow();
      arrowEls.push({line, fromIdx:i-1, toIdx:i});
      scene.appendChild(el);
    }

    if(node.type === 'event'){
      const block = document.createElement('div');
      block.className='event-block';
      block.id='block-'+node.id;
      block.innerHTML=`<div class="event-circle ${node.evClass}" id="ev-${node.id}">${node.icon}</div>
        <div class="event-label">${node.label}</div>`;
      scene.appendChild(block);
      nodeEls[node.id] = block;
    }
    else if(node.type === 'gate'){
      const d = STEPS['problem_solver'];
      const block = document.createElement('div');
      block.className='gateway-block';
      block.id='block-'+node.id;
      block.innerHTML=`
        <div class="gateway-diamond" id="gw-${node.id}">
          ${ASSETS[node.char] ? `<img class="gateway-char" src="${ASSETS[node.char]}" alt="">` : ''}
          <div class="gateway-icon">✦</div>
        </div>
        <div class="gateway-label">${node.label}</div>
        <div class="gateway-paths">
          <span class="gw-path gw-yes">✓ Yes</span>
          <span class="gw-path gw-no">✗ No → Exception</span>
        </div>`;
      block.querySelector('.gateway-diamond').addEventListener('click',()=>openPanel('problem_solver','Gateway'));
      scene.appendChild(block);
      nodeEls[node.id] = block;
    }
    else {
      const s = STEPS[node.id];
      const charSrc  = ASSETS[s.char]  || '';
      const equipSrc = ASSETS[s.equip] || '';
      const envSrc   = ASSETS[s.env]   || '';
      const block = document.createElement('div');
      block.className='step-block';
      block.id='block-'+node.id;
      block.innerHTML=`
        <div class="step-card" id="card-${node.id}">
          <div class="card-stripe ${s.stripe}"></div>
          <div class="card-scene">
            ${envSrc  ? `<img class="card-env"  src="${envSrc}"  alt="">` : ''}
            ${charSrc ? `<img class="card-char" src="${charSrc}" alt="${s.name}" id="cardchar-${node.id}">` : `<div style="height:145px;display:flex;align-items:center;justify-content:center;font-size:40px;">${s.icon||'📦'}</div>`}
            ${equipSrc? `<img class="card-equip" src="${equipSrc}" alt="">` : ''}
          </div>
          <div class="card-info">
            <div class="card-step-num">${s.step}</div>
            <div class="card-title">${s.name}</div>
            <div class="card-role">${s.role}</div>
          </div>
          <div class="card-done-tick">✓</div>
        </div>
        <div class="step-connector-label">${s.step}</div>`;
      block.querySelector('.step-card').addEventListener('click',()=>openPanel(node.id, s.step));
      scene.appendChild(block);
      nodeEls[node.id] = block;
    }
  });

  // Exception branch — positioned absolutely inside world, below gw_item
  buildExceptionBranch();
}

function positionException(){
  const gw1 = document.getElementById('block-gw_item');

  const r2 = gw2.getBoundingClientRect();
  const worldRect = document.getElementById('world').getBoundingClientRect();
  const sceneRect = scene.getBoundingClientRect();

  const cy = sceneRect.height - 60; // near bottom
  ez.style.left = (cx - 90) + 'px';

worldEl.addEventListener('mousedown',e=>{
  if(e.target.closest('.step-card,.gateway-diamond,.exception-card,.event-block'))return;

  worldEl.classList.add('grabbing');

// ══ PLAYBACK ══
const TASK_FLOW_IDS = FLOW.map(n=>n.id); // all node IDs in order
let animStep=-1, animPlaying=false, animTimer=null, animSpeed=1;
const DWELL=1800;

const playBtn  = document.getElementById('pb-play');
const pbLabel  = document.getElementById('pb-label');
const pbFill   = document.getElementById('pb-fill');
const token    = document.getElementById('pkg-token');

function getCardCenter(id){
  const el = document.getElementById('card-'+id) ||
             document.getElementById('ev-'+id) ||
             document.getElementById('gw-'+id);
  if(!el) return null;
  const r = el.getBoundingClientRect();
  return {x: r.left+r.width/2, y: r.top+r.height/2};
}

function scrollToNode(id){
  const block = document.getElementById('block-'+id);
  if(!block) return;
  const bRect = block.getBoundingClientRect();
  const wRect = worldEl.getBoundingClientRect();
  const targetScroll = worldEl.scrollLeft + bRect.left - wRect.left - (wRect.width/2 - bRect.width/2);
  worldEl.scrollTo({left:targetScroll, behavior:'smooth'});
}

function goToStep(idx){
  if(idx<0||idx>=TASK_FLOW_IDS.length) return;
  animStep=idx;
  const id = TASK_FLOW_IDS[idx];

  // Mark cards
  TASK_FLOW_IDS.forEach((fid,i)=>{
    const card = document.getElementById('card-'+fid);
    if(!card) return;
    card.classList.remove('active','done');
    if(i<idx) card.classList.add('done');
    else if(i===idx) card.classList.add('active');
  });

  // Light up arrows
  arrowEls.forEach(({line,toIdx})=>{
    line.classList.remove('lit');
    if(toIdx===idx) line.classList.add('lit');
  });

  // Move token
  scrollToNode(id);
  requestAnimationFrame(()=>{
    const center = getCardCenter(id);
    if(center){
      token.classList.add('visible');
      token.style.left=center.x+'px';
      token.style.top=center.y+'px';
      token.classList.remove('bounce');
      void token.offsetWidth;
      token.classList.add('bounce');
    }
  });

  // Progress
  const pct = idx/(TASK_FLOW_IDS.length-1)*100;
  pbFill.style.width=pct+'%';
  const s = STEPS[id];
  pbLabel.textContent = s ? s.name : (id==='start'?'Truck Arrives':'Package Shipped! 🎉');

  // End
  if(idx===TASK_FLOW_IDS.length-1){
    token.textContent='🎉';
    setTimeout(()=>token.textContent='📦',2000);
  }
}

function startPlay(){
  if(animStep>=TASK_FLOW_IDS.length-1){resetAnim();}
  animPlaying=true; playBtn.textContent='⏸';
  tick();
}
function stopPlay(){animPlaying=false;playBtn.textContent='▶';clearTimeout(animTimer);}
function tick(){
  if(!animPlaying)return;
  const next=animStep+1;
  if(next>=TASK_FLOW_IDS.length){stopPlay();return;}
  goToStep(next);
  animTimer=setTimeout(tick,DWELL/animSpeed);
}
function resetAnim(){
  stopPlay();animStep=-1;
  TASK_FLOW_IDS.forEach(id=>{
    const c=document.getElementById('card-'+id);if(c)c.classList.remove('active','done');
  });
  arrowEls.forEach(({line})=>line.classList.remove('lit'));
  token.classList.remove('visible');
  pbFill.style.width='0%';
  pbLabel.textContent='Press ▶ to walk the warehouse';
}

playBtn.addEventListener('click',()=>animPlaying?stopPlay():startPlay());
document.getElementById('pb-next').addEventListener('click',()=>{stopPlay();goToStep(animStep+1);});
document.getElementById('pb-prev').addEventListener('click',()=>{stopPlay();goToStep(Math.max(0,animStep-1));});
document.getElementById('pb-restart').addEventListener('click',resetAnim);

const speeds=[1,2,3]; let spIdx=0;
document.getElementById('pb-speed').addEventListener('click',()=>{
  spIdx=(spIdx+1)%3; animSpeed=speeds[spIdx];
  document.getElementById('pb-speed').textContent=animSpeed+'×';
});

let renderer3=null,scene3=null,cam3=null,pts3=null,animId3=null;
function initBg(){
  const cv=document.getElementById('bg-canvas');
  if(!cv||!window.THREE)return;
  scene3=new THREE.Scene();
  cam3=new THREE.PerspectiveCamera(70,cv.clientWidth/cv.clientHeight,0.1,1000);
  cam3.position.z=6;
  renderer3=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:false});
  renderer3.setSize(cv.clientWidth,cv.clientHeight);
  renderer3.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
  renderer3.setClearColor(0x000000,0);
  const N=400,geo=new THREE.BufferGeometry();
  const pos=new Float32Array(N*3),col=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    pos[i*3]=(Math.random()-0.5)*30; pos[i*3+1]=(Math.random()-0.5)*20; pos[i*3+2]=(Math.random()-0.5)*12;
    const t=Math.random(); col[i*3]=1; col[i*3+1]=0.35+t*0.45; col[i*3+2]=t*0.06;
  }
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  pts3=new THREE.Points(geo,new THREE.PointsMaterial({size:0.055,vertexColors:true,transparent:true,opacity:0.45,sizeAttenuation:true}));
  scene3.add(pts3);
  // Subtle grid
  const g=new THREE.GridHelper(40,25,0xFF9900,0x1a2535);
  g.position.y=-6;g.material.opacity=0.06;g.material.transparent=true;scene3.add(g);
}
function animBg(){
  animId3=requestAnimationFrame(animBg);
  if(!pts3||!renderer3)return;
  const t=Date.now()*0.0003;
  pts3.rotation.y=t*0.08; pts3.rotation.x=Math.sin(t*0.2)*0.04;
  const p=pts3.geometry.attributes.position.array;
  for(let i=1;i<p.length;i+=3){p[i]+=0.002;if(p[i]>10)p[i]=-10;}
  pts3.geometry.attributes.position.needsUpdate=true;
  renderer3.render(scene3,cam3);
}
window.addEventListener('resize',()=>{
  const cv=document.getElementById('bg-canvas');
  if(!renderer3||!cv)return;
  renderer3.setSize(cv.clientWidth,cv.clientHeight);
  if(cam3){cam3.aspect=cv.clientWidth/cv.clientHeight;cam3.updateProjectionMatrix();}
  positionException();
});
initBg(); animBg();

  {id:'packing',      badge:'Step 6', role:'Packer',                 action:'Sealing the optimal box with ML assist',   desc:'ML selects the best box size. Packers verify items, add void fill, seal it tight, and send to SLAM.',            tools:['ML Box Selection','Tape Dispenser'],        char:'role_packer',              equip:'equip_packing_station',  env:'equip_packing_station'},
  {id:'slam',         badge:'Step 7', role:'SLAM Associate',         action:'Scan → Label → Apply → Manifest',         desc:'The SLAM machine reads the barcode, applies the label, weighs the package, and manifests with the carrier.',       tools:['SLAM Machine','Conveyor Scale'],            char:'role_slam',                equip:'equip_slam_machine',     env:'equip_sorter_conveyor'},
  {id:'gw_weight',    badge:'Check',  role:'Problem Solver',         action:'Cross-checking weight vs. expected',       desc:'Package weight is verified against expected. A mismatch means a missing item — routed to Problem Solver.',        tools:['Conveyor Scale','Exception System'],        char:'role_problem_solver',      equip:'prop_shipping_label',    env:'equip_sorter_conveyor'},
  {id:'shipping',     badge:'Step 8', role:'Shipping Associate',     action:'Loading sorted packages onto trucks',      desc:"Packages fly down sorter conveyors into carrier chutes and onto trucks, pre-optimised for last-mile speed.",       tools:['Sorter Conveyor','Shipping Dock'],          char:'role_shipping',            equip:'vehicle_outbound_truck', env:'equip_dock_conveyor'},
  {id:'end',          badge:'Done',   role:'Delivery Driver',        action:'On the road to the customer',              desc:'The package leaves the FC on an Amazon van. The customer gets their order — mission complete.',                   tools:['Delivery Van','Route Optimisation'],        char:'role_delivery_driver',     equip:'vehicle_outbound_truck', env:'vehicle_outbound_truck_02'},
];

let cinStep=0, cinPlaying=false;
let cinRenderer=null,cinScene=null,cinCam=null,cinPts=null,cinAnim=null;

function initCinThree(){
  const cv=document.getElementById('cinema-bg-canvas');
  if(!cv||!window.THREE)return;
  cinScene=new THREE.Scene();cinCam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,1000);cinCam.position.z=5;
  cinRenderer=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:false});
  cinRenderer.setSize(innerWidth,innerHeight);cinRenderer.setPixelRatio(Math.min(devicePixelRatio,1.5));cinRenderer.setClearColor(0,0);
  const N=250,geo=new THREE.BufferGeometry(),p=new Float32Array(N*3),c=new Float32Array(N*3);
  for(let i=0;i<N;i++){p[i*3]=(Math.random()-0.5)*22;p[i*3+1]=(Math.random()-0.5)*16;p[i*3+2]=(Math.random()-0.5)*10;const t=Math.random();c[i*3]=1;c[i*3+1]=0.4+t*0.45;c[i*3+2]=t*0.08;}
  geo.setAttribute('position',new THREE.BufferAttribute(p,3));geo.setAttribute('color',new THREE.BufferAttribute(c,3));
  cinPts=new THREE.Points(geo,new THREE.PointsMaterial({size:0.07,vertexColors:true,transparent:true,opacity:0.5,sizeAttenuation:true}));
  cinScene.add(cinPts);
  const g=new THREE.GridHelper(30,20,0xFF9900,0x1a2535);g.position.y=-5;g.material.opacity=0.1;g.material.transparent=true;cinScene.add(g);
}
function animCin(){
  cinAnim=requestAnimationFrame(animCin);
  if(!cinPts||!cinRenderer)return;
  const t=Date.now()*0.0004;
  cinPts.rotation.y=t*0.12;cinPts.rotation.x=Math.sin(t*0.25)*0.06;
  const p=cinPts.geometry.attributes.position.array;
  for(let i=1;i<p.length;i+=3){p[i]+=0.003;if(p[i]>8)p[i]=-8;}
  cinPts.geometry.attributes.position.needsUpdate=true;
  cinRenderer.render(cinScene,cinCam);
}
function stopCin(){if(cinAnim){cancelAnimationFrame(cinAnim);cinAnim=null;}}

function openCinema(idx){
  cinStep=Math.max(0,Math.min(idx,CINEMA.length-1));
  renderCin();
  document.getElementById('cinema-overlay').classList.add('visible');
  if(!cinRenderer)initCinThree();
  animCin();
  buildCinDots();
  // Also scroll BPMN to that node
  goToStep(TASK_FLOW_IDS.indexOf(CINEMA[cinStep].id));
}
function closeCinema(){
  document.getElementById('cinema-overlay').classList.remove('visible');
  stopCin();
  resetCinAnims();
}
function resetCinAnims(){
  ['cin-char','cin-equip'].forEach(id=>{const e=document.getElementById(id);if(e)e.classList.remove('entered');});
  ['cin-desc','cin-tools','cin-action'].forEach(id=>{const e=document.getElementById(id);if(e)e.classList.remove('entered');});
}
function renderCin(){
  const s=CINEMA[cinStep];if(!s)return;
  resetCinAnims();
  document.getElementById('cin-badge').textContent=s.badge;
  document.getElementById('cin-title').textContent=s.id==='start'?'Truck Arrives':s.id==='end'?'Package Shipped! 🎉':(STEPS[s.id]?.name||s.id);
  document.getElementById('cin-role').textContent=s.role;
  document.getElementById('cin-action').textContent='⚡ '+s.action;
  document.getElementById('cin-desc').textContent=s.desc;
  document.getElementById('cin-tools').innerHTML=s.tools.map(t=>`<span class="cin-chip">⚙ ${t}</span>`).join('');
  document.getElementById('cin-env').src=ASSETS[s.env]||'';
  document.getElementById('cin-char').src=ASSETS[s.char]||'';
  document.getElementById('cin-equip').src=ASSETS[s.equip]||'';
  setTimeout(()=>{document.getElementById('cin-char').classList.add('entered');},80);
  setTimeout(()=>{document.getElementById('cin-equip').classList.add('entered');},220);
  setTimeout(()=>{document.getElementById('cin-action').classList.add('entered');},120);
  setTimeout(()=>{document.getElementById('cin-desc').classList.add('entered');},180);
  setTimeout(()=>{document.getElementById('cin-tools').classList.add('entered');},270);
  updateCinDots();
}
function buildCinDots(){
  document.getElementById('cin-dots').innerHTML=CINEMA.map((_,i)=>`<div class="c-dot" id="cdot-${i}"></div>`).join('');
  updateCinDots();
}
function updateCinDots(){
  CINEMA.forEach((_,i)=>{const d=document.getElementById('cdot-'+i);if(!d)return;d.className='c-dot'+(i<cinStep?' done':i===cinStep?' active':'');});
}
function advCin(d){
  const n=cinStep+d;
  if(n<0||n>CINEMA.length-1){if(d>0)closeCinema();return;}
  cinStep=n;
  resetCinAnims();
  document.getElementById('cinema-overlay').classList.remove('visible');
  setTimeout(()=>{
    renderCin();
    document.getElementById('cinema-overlay').classList.add('visible');
    goToStep(TASK_FLOW_IDS.indexOf(CINEMA[cinStep].id));
  },180);
}
document.getElementById('cin-close').addEventListener('click',closeCinema);
document.getElementById('cin-next').addEventListener('click',()=>advCin(1));
document.getElementById('cin-prev').addEventListener('click',()=>advCin(-1));
document.getElementById('cinema-overlay').addEventListener('click',e=>{
  if(e.target===document.getElementById('cinema-overlay')||e.target===document.getElementById('cinema-bg-canvas'))closeCinema();
});
document.addEventListener('keydown',e=>{
  const ov=document.getElementById('cinema-overlay');
  if(ov.classList.contains('visible')){
    if(e.key==='ArrowRight'||e.key==='ArrowDown')advCin(1);
    if(e.key==='ArrowLeft'||e.key==='ArrowUp')advCin(-1);
    if(e.key==='Escape')closeCinema();
  }
});

// Header buttons
document.getElementById('view-story-btn').addEventListener('click',()=>{
  openCinema(0);
  document.getElementById('view-story-btn').classList.add('active');
  document.getElementById('view-flow-btn').classList.remove('active');
});
document.getElementById('view-flow-btn').addEventListener('click',()=>{
  closeCinema();
  document.getElementById('view-flow-btn').classList.add('active');
  document.getElementById('view-story-btn').classList.remove('active');
});
document.getElementById('story-btn').addEventListener('click',()=>openCinema(0));

window.addEventListener('resize',()=>{
  if(!cinRenderer)return;
  cinRenderer.setSize(innerWidth,innerHeight);
  if(cinCam){cinCam.aspect=innerWidth/innerHeight;cinCam.updateProjectionMatrix();}
});

// Position exception zone after fonts/images settle
setTimeout(positionException, 600);
window.addEventListener('resize', positionException);
</script>
</body>
